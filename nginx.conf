server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter's --wasm build needs cross-origin isolation to use skwasm_heavy;
    # without these it falls back to a renderer that crawls or fails to boot.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # nginx's mime.types has no .mjs entry, so it falls back to
    # application/octet-stream and Chromium refuses the ES module outright.
    location ~ \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Handle single-page app routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
